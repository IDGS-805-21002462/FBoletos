<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta de Boletos para Eventos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand">
                <img src="./icons/boleto.png" alt="Icono" width="30" height="30" class="d-inline-block align-text-top me-2">
                TicketEventos
            </a>
            <div class="ms-auto" id="menu-usuario">
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="text-center mb-4">Cartelera de Eventos y Conciertos</h1>
        <div class="row mb-4 justify-content-center">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text">Buscar Zona</span>
                    <select id="filtroZonaHTML" class="form-select">
                        <option value="">Todas las zonas</option>
                        <option value="VIP">VIP</option>
                        <option value="Preferente">Preferente</option>
                        <option value="Platinium">Platinium</option>
                        <option value="Oro">Oro</option>
                        <option value="Plata">Plata</option>
                        <option value="General A">General A</option>
                        <option value="General B">General B</option>
                        <option value="Grada / Tribuna">Grada / Tribuna</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="lista-eventos" class="row">
        </div>
    </div>

    <div class="modal fade" id="modalComprar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Comprar Boletos para: <span id="modalTituloEvento"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formComprarBoleto">
                        <input type="hidden" id="eventoIdCompra">
                        
                        <div class="mb-3">
                            <label class="form-label">Tu Nombre:</label>
                            <!-- El input ahora es de solo lectura y se autocompleta con JS -->
                            <input type="text" id="compradorNombre" class="form-control" readonly required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico:</label>
                            <!-- El input ahora es de solo lectura y se autocompleta con JS -->
                            <input type="email" id="compradorEmail" class="form-control" readonly required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Selecciona la Zona:</label>
                            <select id="selectZona" class="form-select" required>
                                <option value="">Cargando zonas...</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Cantidad de Boletos:</label>
                            <input type="number" id="cantidadBoletos" class="form-control" min="1" value="1" required>
                        </div>
                        
                        <div class="text-center my-3">
                            <small class="text-muted">Tiempo restante para completar la compra:</small>
                            <div id="relojTemporizador" class="fw-bold text-danger fs-5">03:00</div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 mb-2">Confirmar y Pagar</button>
                        <button type="button" id="btnCancelar" class="btn btn-outline-danger w-100">Cancelar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
