<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta de Boletos para Eventos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4" >
        <div class="container">
            <a class="navbar-brand">
                <img src="./icons/boleto.png" alt="Icono" width="30" height="30" class="d-inline-block align-text-top me-2">
                TicketEventos</a>
            <div class="ms-auto">
                <a href="admin.html" class="btn btn-outline-light btn-sm">
                    <img src="./icons/mas.png" alt="Icono" width="16" height="16" class="d-inline-block align-text-top me-2">
                    Administrar / Crear Eventos</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="text-center mb-4">Cartelera de Eventos y Conciertos</h1>

        <!-- Contenedor donde se cargarán los eventos desde el Backend -->
        <div id="lista-eventos" class="row">
            <!-- Los eventos se inyectarán aquí con JavaScript -->
        </div>
    </div>

    <!-- Modal para Comprar Boletos -->
    <div class="modal fade" id="modalComprar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Comprar Boletos para: <span id="modalTituloEvento"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formComprarBoleto">
                        <input type="hidden" id="eventoIdCompra">
                        
                        <div class="mb-3">
                            <label class="form-label">Tu Nombre:</label>
                            <input type="text" id="compradorNombre" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico:</label>
                            <input type="email" id="compradorEmail" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Selecciona la Zona:</label>
                            <select id="selectZona" class="form-select" required>
                                <option value="">Cargando zonas...</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Cantidad de Boletos:</label>
                            <input type="number" id="cantidadBoletos" class="form-control" min="1" value="1" required>
                        </div>
                        
                       
                        <div class="text-center my-3">
                            <small class="text-muted">Tiempo restante para completar la compra:</small>
                            <div id="relojTemporizador" class="fw-bold text-danger fs-5">03:00</div>
                        </div>


                        <button type="submit" class="btn btn-success w-100 mb-2">Confirmar y Pagar</button>
                        <button type="button" id="btnCancelar" class="btn btn-outline-danger w-100">Cancelar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts de Bootstrap y tu Lógica JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
