<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Eventos - TicketEventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">🎟️ TicketEventos (Volver al Inicio)</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Crear Nuevo Evento y sus Zonas</h3>
                        
                        <form id="formCrearEvento">
                            <h5 class="text-primary mb-3">1. Información del Evento</h5>
                            <div class="mb-3">
                                <label class="form-label">Título del Evento:</label>
                                <input type="text" id="titulo" class="form-control" placeholder="Ej. Concierto de Rock" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Descripción:</label>
                                <textarea id="descripcion" class="form-control" rows="2" placeholder="Detalles del evento..."></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Fecha y Hora:</label>
                                    <input type="datetime-local" id="fechaHora" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Lugar:</label>
                                    <input type="text" id="lugar" class="form-control" placeholder="Ej. Estadio GNP" required>
                                </div>
                            </div>

                            <hr class="my-4">

                            <h5 class="text-primary mb-3">2. Zona de Boletos (Ej. General, VIP, Preferente)</h5>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Nombre de la Zona:</label>
                                    <input type="text" id="nombreZona" class="form-control" placeholder="Ej. VIP" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Precio ($):</label>
                                    <input type="number" step="0.01" id="precioZona" class="form-control" min="0" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Lugares Disponibles:</label>
                                    <input type="number" id="lugaresZona" class="form-control" min="1" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success w-100 mt-3">Guardar Evento con Zona</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://localhost:7072/api";

        document.getElementById("formCrearEvento").addEventListener("submit", async (e) => {
            e.preventDefault();

            // Estructura que coincide con tu backend (incluyendo la lista de ZonasEventos)
            const nuevoEvento = {
                titulo: document.getElementById("titulo").value,
                descripcion: document.getElementById("descripcion").value,
                fechaHora: document.getElementById("fechaHora").value,
                lugar: document.getElementById("lugar").value,
                zonas: [  // <-- CAMBIADO A "zonas" para que coincida con tu modelo y controlador
                    {
                        nombreZona: document.getElementById("nombreZona").value,
                        precio: parseFloat(document.getElementById("precioZona").value),
                        lugaresDisponibles: parseInt(document.getElementById("lugaresZona").value)
                    }
                ]
            };

            try {
                const respuesta = await fetch(`${API_URL}/Eventos`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(nuevoEvento)
                });

                if (respuesta.ok) {
                    alert("¡Evento y zona creados con éxito! 🎸");
                    window.location.href = "index.html"; 
                } else {
                    alert("Error al guardar el evento.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("No se pudo conectar con el servidor.");
            }
        });
    </script>
</body>
</html>
